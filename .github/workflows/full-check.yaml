# The full suite on every push to main: unit tests with coverage, the
# Playwright end-to-end tests including the golden screenshots, and a
# production build.
#
# Ubuntu only. The Windows leg this file used to carry came from the bridge
# repos, where it covered the Dart host abstraction — this app has no Dart
# at all, and the golden screenshots would only pick up the font rendering
# of a second platform.

name: Full Check

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve native build scripts
        run: pnpm approve-builds --all

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests with coverage and lint
        run: pnpm run test:unit

      - name: End-to-end tests including golden screenshots
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build
